name: Run main on schedule

on:
  schedule:
    - cron: '*/5 * * * *'  # every hour, on the hour (UTC)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        run: python main.py
